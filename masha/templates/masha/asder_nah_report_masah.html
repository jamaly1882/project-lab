<form role="search" class="text-center">
  <input type="search" id="live_search_input" name="q"
         placeholder="ابحث هنا..." aria-label="بحث"
         class="form-control" style="width:50%; margin:auto;" dir="rtl">
</form>






   
      
      
   <table border="3" width="80%" id="live_search_results">
  <thead>
    <tr style="background-color:#191970 ;height: 60px;">
     
      <th style="color: #ffffff;">عرض الكروكي</th>
      <th style="color: #ffffff;">عرض المعاينة</th>
      <th style="color: #ffffff;">عرض البصيرة</th>
      <th style="color: #ffffff;">عرض   الطلب</th>
      
      <th style="color: #ffffff;">نوع الوثيقة</th>
      <th style="color: #ffffff;">رقم  وحدة الجوار</th>
      <th style="color: #ffffff;">المديرية</th>
      
      <th style="color: #ffffff;">التاريخ</th>
       <th style="color: #ffffff;">نوع  الطلب</th>
      <th style="color: #ffffff;">اسم المواطن</th>
      <th style="color: #ffffff;">رقم التقرير</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

  

 <script src="{% static 'assets/js/jquery-3.6.0.min.js' %}"> </script>
<script>
$(document).ready(function(){

  $('#live_search_input').on('keyup', function(){
    let query = $(this).val().trim();

    $.ajax({
      url: "{% url 'masha:live_search_ajax_table' %}",
      data: { q: query },
      dataType: 'json',
      success: function(res){
        let html = '';

        if(res.results.length > 0){
          res.results.forEach(item => {
            html += `
              <tr>
              <td>
  ${ item.location_url
     ? `<a href="${item.location_url}" target="_blank">عرض الموقع</a>`
     : '' }
</td>

               <td>${ item.img_document_url ? `<a href="${item.img_document_url}" target="_blank">عرض</a>` : '' }</td>
                <td>${ item.img_parsone_url ? `<a href="${item.img_parsone_url}" target="_blank">عرض</a>` : '' }</td>
                <td><a href="${item.request_image_url}" target="_blank">عرض</a></td>
                <td>${item.typ_name}</td>
                <td>${item.unit_name}</td>
               
                <td>${item.mahfth_name}</td>
               
                
               
                <td>${item.ajaml}</td>
                 <td>${item.hidden_ansh_hdm}</td>
                <td>${item.name}</td>
                <td>${item.id}</td>
              </tr>`;
          });
        } else {
          html = `<tr><td colspan="11" align="center">لا توجد نتائج</td></tr>`;
        }

        $('#live_search_results tbody').html(html);
      }
    });

  });

});
</script>


</script>
