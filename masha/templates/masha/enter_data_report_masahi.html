<script type="text/javascript">
var $j = jQuery.noConflict();

$j(document).ready(function() {

    // عرض حقول الوكيل حسب الاختيار
    $('#list_form').change(function(){
        const selected = $(this).val();
        if (selected === 'وكيل' || selected === 'مفوض') {
            $('#agent_fields').show();
        } else {
            $('#agent_fields').hide();
        }
        $(this).css('border-color',''); // إزالة اللون الأحمر عند تغيير الاختيار
    });

    // دالة لإظهار رسالة خطأ وتركز على الحقل
    function errorAlert(message, selector) {
        Swal.fire({
            icon: 'error',
            title: 'خطأ',
            text: message
        });
        if (selector) {
            $(selector).focus().css('border-color','red');
        }
    }

    // دالة لإعادة تعيين اللون لجميع الحقول
    function resetBorders() {
        $('#f2, #f4, #f6,#ansh_hdm, #name_aml, #phone, #card_id, #erea_11, #streat_name, #type_document, #month, #year, #vald_tam_s, #img_parson_card, #img_document_baser_nah, #vald_tharb, #list_form, #mderah','#vald_document').css('border-color','');
    }

    // إزالة اللون الأحمر عند تصحيح الحقول
    var fields = ['#f2','#f4','#name_aml','#phone','#card_id','#erea_11','#streat_name','','#hid_vald_document','#hid_type_document','#month','#year','#vald_tam_s','#img_parson_card','#img_document_baser_nah','#hid_ansh_hdm','#list_form','#hid_mah'];
    fields.forEach(function(sel){
        $j(sel).on('input change', function(){
            if ($j(this).val() && $j(this).val() !== "") {
                $j(this).css('border-color','');
            }
        });
    });

    $('#form_a').submit(function(e) {
        e.preventDefault();
        resetBorders();  // إعادة تعيين قبل أي تحقق

        // تعيين التاريخ الحالي
        var today = new Date();
      

// تحويل التاريخ إلى سلسلة نصية باستخدام الصيغة المحددة.
var date_string = today.getFullYear() + '-' + (today.getMonth() + 1) + '-' + today.getDate();

// تعيين القيمة المستخدمة إلى حقل النص المحدد.
$('#text36').val(date_string);
        var day = String(today.getDate()).padStart(2, '0');
        var month = String(today.getMonth() + 1).padStart(2, '0');
        var year = today.getFullYear();
        $('#date_str').val(day + '/' + month + '/' + year);

        // قراءة القيم
        var f2 = $.trim($('#f2').val());
        var f4 = $.trim($('#f4').val());
        var name_aml = $.trim($('#name_aml').val());
        var phone = $.trim($('#phone').val());
        var streat_name = $.trim($('#streat_name').val());
        var hid_ansh_hdm = $.trim($('#hid_ansh_hdm').val());
        var hid_type_form_rakash = $.trim($('#hid_type_form_rakash').val());
        var hid_type_document = $.trim($('#hid_type_document').val());
        var hid_type_aqure = $.trim($('#hid_type_aqure').val());
         var hid_vald_document = $.trim($('#hid_vald_document').val());
        
        var month_val = $('#month').val();
        var year_val = $('#year').val();
        var hide_vald_tam_s = $('#hide_vald_tam_s').val();
        var img_parson_card = $('#img_parson_card')[0].files[0];
        var img_document_baser_nah = $('#img_document_baser_nah')[0].files[0];

        // التحقق من الحقول بالترتيب
        if (!hid_ansh_hdm) return errorAlert('يرجى تحديد الغرض من التقرير', '#ansh_hdm');
        if (!hid_type_form_rakash) return errorAlert('يرجى تحديد صفة مقدم الطلب', '#list_form');
        if (f2 === "" && hid_type_form_rakash != "صاحب الطلب") return errorAlert('يرجى إدخال اسم الوكيل', '#f2');
        if (!/^[ء-ي\s]+$/.test(f2) && hid_type_form_rakash != "صاحب الطلب") return errorAlert('اسم الوكيل يجب أن يكون نص', '#f2');
        if (f4 === "" && hid_type_form_rakash != "صاحب الطلب") return errorAlert('يرجى ادخال رقم هاتف الوكيل', '#f4');
        if ((f4 !== "" && (!$.isNumeric(f4) || f4 <= 0)) && hid_type_form_rakash != "صاحب الطلب") return errorAlert('رقم هاتف الوكيل يجب أن يكون رقم صحيح', '#f4');
        if (f4.length < 9 && hid_type_form_rakash != "صاحب الطلب") return errorAlert('رقم هاتف الوكيل أقل من 9 أرقام', '#f4');

        if (!name_aml) return errorAlert('يرجى إدخال اسم صاحب الطلب', '#name_aml');
        if (!/^[ء-ي\s]+$/.test(name_aml)) return errorAlert('اسم صاحب الطلب يجب أن يكون نص', '#name_aml');

        if (!phone) return errorAlert('يرجى إدخال رقم الهاتف', '#phone');
        if (!$.isNumeric(phone) || phone <= 0) return errorAlert('رقم الهاتف يجب أن يكون رقم', '#phone');
        if (phone.length < 9) return errorAlert('رقم الهاتف أقل من 9 أرقام', '#phone');

        if (!$('#hid_mah').val()) return errorAlert('يرجى تحديد المديرية', '#mderah');
        if (!streat_name) return errorAlert('يرجى إدخال اسم الحي', '#streat_name');
        if (!/^[ء-ي\s]+$/.test(streat_name)) return errorAlert('اسم الحي يجب أن يكون نص وليس رقم', '#streat_name');

        if (hid_ansh_hdm != "استشارة") {
            if (!hid_type_document) return errorAlert('يرجى تحديد نوع الوثيقة', '#type_document');
            if (!hid_type_aqure) return errorAlert('تحقق من صحة الوثيقة', '#vald_tharb');
            if (!erea_11) return errorAlert('يرجى إدخال مساحة الوثيقة', '#erea_11', '#profile');
            var erea_val = parseFloat($('#erea_11').val());
if (isNaN(erea_val) || erea_val <= 0) {
    return errorAlert('مساحة الوثيقة يجب أن تكون رقمًا صحيحًا أكبر من الصفر', '#erea_11', '#profile');
}
            if ((hid_type_document === "عقد املاك" || hid_type_document === "عقد اوقاف") && (!month_val || !$.isNumeric(month_val) || month_val <= 0)) return errorAlert('يجب إدخال رقم العقد بشكل صحيح', '#month');
          
            if (!hide_vald_tam_s  && (hid_type_document === "عقد املاك" || hid_type_document === "عقد اوقاف")) return errorAlert('يرجى تحديد طريقة التحقق', '#vald_tam_s');
            
            if (!img_parson_card) return errorAlert('يرجى إدخال صورة الهوية', '#img_parson_card');
            if (!img_document_baser_nah) return errorAlert('يرجى تحديد وثيقة الملكية', '#img_document_baser_nah');
        }
        

        // الإرسال
        var form_data = new FormData(this);
       

form_data.append('date_str', document.querySelector('#date_str').value);  
form_data.append('hid_mah', document.querySelector('#hid_mah').value);    
form_data.append('name_aml', document.querySelector('#name_aml').value);
form_data.append('phone', document.querySelector('#phone').value);
form_data.append('card_id', document.querySelector('#card_id').value);
form_data.append('hid_type_form_rakash', document.querySelector('#hid_type_form_rakash').value);
form_data.append('hid_type_document', document.querySelector('#hid_type_document').value);
form_data.append('streat_name', document.querySelector('#streat_name').value);
form_data.append('hid_type_aqure', document.querySelector('#hid_type_aqure').value);
form_data.append('hid_ansh_hdm', document.querySelector('#hid_ansh_hdm').value);

form_data.append('month', document.querySelector('#month').value);
form_data.append('year', document.querySelector('#year').value);
form_data.append('text_36', document.querySelector('#text36').value);

form_data.append('f2', document.querySelector('#f2').value);
form_data.append('f4', document.querySelector('#f4').value);
form_data.append('f6', document.querySelector('#f6').value);
form_data.append('erea_11', document.querySelector('#erea_11').value);
form_data.append('asher', document.querySelector('#asher').value);
form_data.append('img_parsone', document.querySelector('#img_parson_card').files[0]);
form_data.append('img_document', document.querySelector('#img_document_baser_nah').files[1]);


        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/masha/form_add_masah');
        xhr.onload = function() {
           Swal.fire({
    icon: 'success',
    title: 'تم بنجاح',
    text: 'تم حفظ البيانات بنجاح',
    confirmButtonText: 'موافق'
}).then(() => {
    // فتح الملف في نافذة جديدة
    window.open("{% url 'masha:tslam' %}", '_blank');
    
    // تصفير الحقول
     $j('#form_a')[0].reset();
});
        };
        xhr.send(form_data);
    });

    $('#mderah').change(function() {
        var selectedOption = $(this).val();
        $('#hid_mah').val(selectedOption);
        $('#asher').val(selectedOption);
        $(this).css('border-color',''); // إزالة اللون الأحمر عند اختيار المديرية
    });
