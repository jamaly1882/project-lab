{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نظام المساحة الإلكتروني</title>

  <!-- CSS -->
  <link href="{% static 'css/font-awesome.min.css' %}" rel="stylesheet">
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'css/templatemo-style.css' %}" rel="stylesheet">
  <link href="{% static 'css/sweetalert2.min.css' %}" rel="stylesheet">

  <!-- jQuery -->
  <script src="{% static 'assets/js/jquery-3.6.0.min.js' %}"></script>
  <script src="{% static 'js/sweetalert2.all.min.js' %}"></script>

<style>
  /* تعريف خط Noto Kufi Arabic */
  @font-face {
    font-family: 'Noto Kufi Arabic';
    src: url("{% static 'fonts/NotoKufiArabic-Regular.ttf' %}") format('truetype');
    font-weight: normal;
    font-style: normal;
  }
  @font-face {
    font-family: 'Noto Kufi Arabic';
    src: url("{% static 'fonts/NotoKufiArabic-Bold.ttf' %}") format('truetype');
    font-weight: bold;
    font-style: normal;
  }

  /* تطبيق الخط على جميع الصفحة */
  body, input, select, textarea, button, table {
    font-family: 'Noto Kufi Arabic', sans-serif;
    font-size: 18px; /* حجم الخط العام */
    direction: rtl;
    text-align: right;
    background: #f5f6fa;
  }

  h1 { font-size: 36px; }
  h2 { font-size: 28px; font-weight: bold; margin-bottom: 30px; text-align: center; }
  h3 { font-size: 24px; }

  /* أزرار */
  .templatemo-blue-button {
    font-size: 16px;
    padding: 12px 25px;
    border-radius: 8px;
    cursor: pointer;
  }
  .templatemo-blue-button:hover {
    background:#2c80c9;
  }

  /* الجداول */
  .table td, .table th {
    font-size: 16px;
    text-align: right;
  }

  /* الفورم */
  .form-control {
    font-size: 16px;
    padding: 10px;
  }

  /* تنظيم الصفحة */
  .templatemo-flex-row {
    display: flex;
    flex-direction: row-reverse;
  }
  .templatemo-sidebar {
    order: 1;
    right: 0;
    left: auto;
  }
  .templatemo-content {
    order: 2;
    width: 100%;
    padding: 40px;
  }
</style>

</head>

<body>
  <div class="templatemo-flex-row">
    <!-- القائمة الجانبية -->
    <div class="templatemo-sidebar">
      <header class="templatemo-site-header">
        <div class="square"></div>
        <h1>مدير النظام</h1>
      </header>

      <div class="profile-photo-container">
        <img src="{% static 'assets/image/bg-head-03.jpg' %}" alt="Profile Photo" class="img-responsive">
        <div class="profile-photo-overlay"></div>
      </div>

      <form class="templatemo-search-form" role="search">
        <div class="input-group">
          <button type="submit" class="fa fa-search"></button>
          <input type="text" class="form-control" placeholder="بحث" name="srch-term" id="srch-term">
        </div>
      </form>

      <div class="mobile-menu-icon"><i class="fa fa-bars"></i></div>

      <nav class="templatemo-left-nav">
        <ul>
          <li><a href="{% url 'masha:index' %}" class="active"><i class="fa fa-home fa-fw"></i>الرئيسية</a></li>
         
          <li><a href="{% url 'accounts:user_logout' %}"><i class="fa fa-eject fa-fw"></i>تسجيل الخروج</a></li>
        </ul>
      </nav>
    </div>

<div class="container">
     <div class="templatemo-content-widget white-bg p-3 mb-4">


  <h2>إدارة المهندسين</h2>

  <form id="engForm" class="mb-4">
    {% csrf_token %}
    <input type="hidden" name="id" id="id">

    <div class="row mb-3">
      <div class="col-md-6">
        <label>المديرية</label>
        {{ form.mahfth }}
      </div>
      <div class="col-md-6">
        <label>الاسم</label>
        {{ form.name }}
      </div>
    </div>
    <button type="submit" class="btn btn-primary w-100">💾 حفظ</button>
  </form>

  <table class="table table-bordered text-center align-middle">
    <thead class="table-light">
      <tr>
        <th>الاسم</th>
        <th>المديرية</th>
        <th>العمليات</th>
      </tr>
    </thead>
    <tbody id="dataTable">
      {% for e in engs %}
      <tr data-id="{{ e.id }}">
        <td>{{ e.name }}</td>
        <td>{{ e.mahfth }}</td>
        <td>
          <button class="btn btn-sm btn-warning editBtn">✏️ تعديل</button>
          <button class="btn btn-sm btn-danger deleteBtn">🗑️ حذف</button>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<script>
$(function(){

  // حفظ أو تعديل
  $('#engForm').on('submit', function(e){
    e.preventDefault();
    $.ajax({
      url: "{% url 'masha:manage_eng' %}",
      method: 'POST',
      data: $(this).serialize(),
      success: function(res){
        if(res.success){
          Swal.fire({ icon:'success', title:'تم الحفظ بنجاح', timer:1000, showConfirmButton:false });
          location.reload();
        } else {
          Swal.fire('خطأ', res.error || 'تحقق من البيانات', 'error');
        }
      }
    });
  });

  // تعديل
  $(document).on('click', '.editBtn', function(){
    let row = $(this).closest('tr');
    $('#id').val(row.data('id'));
    $('#id_name').val(row.find('td:eq(0)').text());

    let mahfthText = row.find('td:eq(1)').text().trim();
    $('#id_mahfth option').filter(function(){
      return $(this).text().trim() === mahfthText;
    }).prop('selected', true);

    $('html, body').animate({ scrollTop: 0 }, 'slow');
  });

  // حذف
  $(document).on('click', '.deleteBtn', function(){
    let id = $(this).closest('tr').data('id');
    Swal.fire({
      title: 'هل أنت متأكد؟',
      text: 'سيتم حذف المهندس نهائيًا',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: 'نعم، احذف',
      cancelButtonText: 'إلغاء'
    }).then((result)=>{
      if(result.isConfirmed){
        $.post("{% url 'masha:manage_eng' %}", { id:id, delete:true, csrfmiddlewaretoken:'{{ csrf_token }}' }, function(res){
          if(res.success){
            Swal.fire({ icon:'success', title:'تم الحذف', timer:1000, showConfirmButton:false });
            $(`tr[data-id='${id}']`).remove();
          }
        });
      }
    });
  });

});
</script>

</body>
</html>
