<style>
.input-error {
  border: 2px solid red !important;
  animation: shake 0.2s linear 2;
}

@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-3px); }
  50% { transform: translateX(3px); }
  75% { transform: translateX(-3px); }
  100% { transform: translateX(0); }
}

/* Highlight Checkbox label when invalid */
.checkbox-error + label {
  color: red !important;
  font-weight: bold;
}


input[type="checkbox"] {
    display: none; /* إخفاء الـ checkbox */
}

/* مربعل التحديد */
input[type="checkbox"] + label span {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid #777;
    border-radius: 3px;
    margin-left: 8px; /* مسافة بين المربع والنص */
    position: relative;
    vertical-align: middle;
    cursor: pointer;
}

/* عند التحديد */
input[type="checkbox"]:checked + label span::after {
 
    position: absolute;
    left: 2px;
    top: -4px;
    font-size: 18px;
    color: green;
}

</style>

<div class="templatemo-flex-row">

  <!-- Main content -->
  <div class="templatemo-content col-1 light-gray-bg">

    <div align="right" class="templatemo-content-container mt-4">
<form method="post" enctype="multipart/form-data"
      action="{% url 'masha:update_request' ass.id %}">
    {% csrf_token %}
    <div class="templatemo-content-widget white-bg p-3 mb-4">
        <h2 class="margin-bottom-10">بيانات طلب تقرير مساحي</h2>

        <!-- الغرض من الاستشارة -->
        <div class="row form-group">
        

           <div class="col-lg-6 col-md-6">
    <label>صفة مقدم الطلب <span style="color:red">*</span></label>
    <select id="list_form" name="list_form" class="form-control" dir="rtl">
        {% for i in saf %}
            <option value="{{ i.name }}" {% if ass.saft_sahb_talab == i.name %}selected{% endif %}>
                {{ i.name }}
            </option>
        {% endfor %}
    </select>
</div>
    
    <div class="col-lg-6 col-md-6">
        <label>نوع الطلب <span style="color:red">*</span></label>
        <select id="ansh_hdm" name="ansh_hdm" class="form-control" dir="rtl">
            {% for i in astmrah %}
                <option value="{{ i.name }}"
                    {% if ass.astmarah.name == i.name %}selected{% endif %}>
                    {{ i.name }}
                </option>
            {% endfor %}
        </select>
    </div>
</div>

        <!-- بيانات المالك -->
        <div class="row form-group">
            <div class="col-lg-4 col-md-4">
                <label>رقم الهوية <span style="color:red">*</span></label>
                <input type="text" name="card_id" class="form-control" dir="rtl" value="{{ ass.card_id }}">
            </div>
            <div class="col-lg-4 col-md-4">
                <label>رقم الهاتف <span style="color:red">*</span></label>
                <input type="text" name="phone" class="form-control" dir="rtl" value="{{ ass.phone }}">
            </div>
            <div class="col-lg-4 col-md-4">
                <label>اسم المالك <span style="color:red">*</span></label>
                <input type="text" name="name" class="form-control" dir="rtl" value="{{ ass.name }}">
            </div>
        </div>

        <!-- الموقع -->
        <div class="row form-group">
            <div class="col-lg-4 col-md-4">
                <label>الوصف / الشارع <span style="color:red">*</span></label>
                <input type="text" name="streat_name" class="form-control" dir="rtl" value="{{ ass.streat_name }}">
            </div>
            <div class="col-lg-4 col-md-4">
                <label>القرية / الحي <span style="color:red">*</span></label>
                <input type="text" name="streat_name_gr" class="form-control" dir="rtl" value="{{ ass.streat_name_gr }}">
            </div>
            <div class="col-lg-4 col-md-4">
                <label>المديرية <span style="color:red">*</span></label>
                <select name="mderah" id="mderah" class="form-control" dir="rtl">
                    {% if ass.mahfth %}
                        <option value="{{ ass.mahfth.id }}" selected>{{ ass.mahfth.name }}</option>
                    {% endif %}
                    {% for i in mah %}
                        {% if ass.mahfth.id != i.id %}
                            <option value="{{ i.id }}">{{ i.name }}</option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>
        </div>


        <!-- نوع الوثيقة -->
        <div class="row form-group">
    <div class="col-lg-12 col-md-12">
    <label>نوع الوثيقة <span style="color:red">*</span></label>
    <select name="type_document" id="type_document" class="form-control" dir="rtl">
        {% for i in ty %}
            <option value="{{ i.name }}"{% if ass.typ.name == i.name %}selected{% endif %}>
                {{ i.name }}
            </option>
        {% endfor %}
    </select>
</div>


        <!-- التحقق من العقد -->
        <div class="row form-group">
            <div class="col-lg-4 col-md-4">
                <label>التحقق من العقد</label>
                <select name="vald_document" id="vald_document" class="form-control" dir="rtl">
                    {% if ass.vald_document %}
                        <option value="{{ ass.vald_document }}" selected>{{ ass.vald_document }}</option>
                    {% endif %}
                    {% for i in val %}
                        {% if ass.vald_document != i.name %}
                            <option value="{{ i.name }}">{{ i.name }}</option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>
            <div class="col-lg-4 col-md-4">
                <label>مساحة البصيرة</label>
                <input type="text" name="erea_baser" class="form-control" value="{{ ass.erea_baser }}">
            </div>
            
            <br>
            <br>
        </div>

        <div class="form-group text-left">
            <button type="submit" class="templatemo-blue-button">حفظ</button>
        </div>
    </div>
</form>
