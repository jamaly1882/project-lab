}

/* عند التحديد */

<script>
$(document).ready(function(){
    const form = $('#aqt_abd_nah');
    const csrftoken = $('[name=csrfmiddlewaretoken]').val();

    // إعداد CSRF لـ Django
    $.ajaxSetup({
        headers: { "X-CSRFToken": csrftoken }
    });

    // 🔹 دالة عرض تنبيه
    function msg(type, text) {
        Swal.fire({
            icon: type,
            title: 'تنبيه',
            text: text,
            confirmButtonText: 'موافق'
        });
    }

    // 🔹 إعادة تعيين الحدود
    function resetBorders() {
        form.find('input, select').removeClass('input-error');
        $('#trhl_masah_report').removeClass('checkbox-error');
    }

    // 🔹 دالة تحقق عامة
    function check(val, selector, message) {
        if (!val || val === "اختيار") {
            $(selector).addClass('input-error').focus();
            msg('warning', message);
            return false;
        }
        return true;
    }

function checkCoord(val, selector, message) {
    val = val.trim();

    // يجب أن يكون الرقم مكوناً من 6 أرقام بالضبط
    if (!/^\d{6}$/.test(val)) {
        $(selector).addClass('input-error').focus();

        msg(
            'warning',
            message + ' (يجب أن يكون 6 أرقام بالضبط)'
        );

        return false;
    }

    return true;
}

    // 🔹 إظهار / إخفاء الإحداثيات
    $("#location_arth").change(function(){
        $("#coord-fields").toggle($(this).val() === "إحداثيات");
    });

    // 🔹 checkbox إزالة الخطأ عند التحديد
    $('#trhl_masah_report').change(function(){
        if($(this).is(':checked')){
            $(this).removeClass('checkbox-error');
        }
    });

    // 🔹 عند إرسال النموذج
    form.on('submit', function(e){
        e.preventDefault();
        resetBorders();

        let typeSeol = $('#type_seol').val();
        let typeKah = $('#type_kah').val();

        // ✅ التحقق من بيانات الإسقاط
        if(!check($('#location_arth').val(), '#location_arth', 'يرجى اختيار نظام الإسقاط')) return;
        if(!check($('#e_11').val(), '#e_11', 'يرجى إدخال مساحة صحيحة')) return;
        if(isNaN(parseFloat($('#e_11').val()))){
            $('#e_11').addClass('input-error').focus();
            return msg('warning', 'المساحة يجب أن تكون رقم');
        }

        // ✅ الإحداثيات إذا كان النظام "احدثيات"
      // ✅ الإحداثيات إذا كان النظام "احدثيات"
if ($('#location_arth').val() === "إحداثيات") {
    if (!checkCoord($('#point_1').val(), '#point_1', 'يرجى إدخال إحداثيات الشمال')) return;
    if (!checkCoord($('#point_2').val(), '#point_2', 'يرجى إدخال إحداثيات الشرق')) return;
}

        // ✅ بيانات البلوك
        if(!check($('#type_block').val(), '#type_block', 'يرجى اختيار نوع البلوك')) return;
        if(!check($('#mnsobe').val(), '#mnsobe', 'يرجى تحديد منسوب الشارع')) return;
        if(!check(typeSeol, '#type_seol', 'يرجى اختيار موقع الأرض من مجرى السيول')) return;
        if(!check(typeKah, '#type_kah', 'يرجى اختيار موقع الأرض من خطوط الضغط العالي')) return;
        if(!check($('#type_natural').val(), '#type_natural', 'يرجى اختيار طبيعة موقع الأرض')) return;

        // ✅ بيانات الموقع
     
        if(!check($('#unit').val(), '#unit', 'يرجى اختيار وحدة الجوار')) return;

        // ✅ تحقق من الملفات
        let file_kroki = $('#mahther_line')[0].files[0];
        let file_location = $('#location_a')[0].files[0];

        if(!file_kroki){
            $('#mahther_line').addClass('input-error');
            return msg('warning', 'يرجى رفع صورة معاينة الموقع');
        }
        if(!file_location){
            $('#location_a').addClass('input-error');
            return msg('warning', 'يرجى رفع صورة الكروكي');
        }

        // ✅ التحقق من رأي المهندس
        if(typeSeol === 'داخل مجرى السيول' || typeKah === 'داخل خطوط الضغط العالي'){
           $('#opin_en')
                .val('')
            $('#opin_en')
                .val('الأرض غير سليمة')
                .prop('readonly', true)
                .removeClass('input-error');
            msg('warning', 'رأي المهندس: الأرض غير سليمة');
        } else {
            $('#opin_en').prop('readonly', false).removeClass('input-error');

            let opinion = $('#opin_en').val().trim();
            if(opinion === '' || opinion === 'الأرض غير سليمة'){
                $('#opin_en').addClass('input-error').focus();
                return msg('warning', 'يرجى كتابة رأي المهندس');
            }
            if(!/^[ء-ي\s]+$/.test(opinion)){
                $('#opin_en').addClass('input-error').focus();
                return msg('warning', 'يجب أن يكون رأي المهندس باللغة العربية فقط');
            }
        }

        // ✅ تحقق من الترحيل
        let trhl = $('#trhl_masah_report').is(':checked');
        if(!trhl){
            $('#trhl_masah_report').addClass('checkbox-error');
            return msg('warning', 'يرجى وضع إشارة صح على (الترحيل)');
        }

        // ✅ إنشاء FormData
        let formData = new FormData(this);
        formData.set('tr_masah', trhl ? 'منجزة' : '');
        formData.set('hid_gata', $('#hid_gata').val());
        formData.set('mnsobe', $('#mnsobe').val());
        formData.set('opin_en', $('#opin_en').val());
        formData.set('hid_map_location', $('#hid_map_location').val());
        formData.set('hid_block', $('#hid_block').val());
        formData.set('hid_nat', $('#hid_nat').val());
        formData.set('hid_kah', $('#hid_kah').val());
        formData.set('hid_seol', $('#hid_seol').val());
        formData.set('point_1', $('#point_1').val());
        formData.set('point_2', $('#point_2').val());
        formData.set('mahther_line', file_kroki);
        formData.set('location_a', file_location);

        // ✅ إرسال البيانات عبر AJAX
        let id_11 = $('#id_11').val();
        let redirectUrl = $('#redirect-url').data('url');

        $.ajax({
            url: '/masha/add_abade_report_masahi/' + id_11,
            method: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            success: function(){
                Swal.fire({
                    icon:'success',
                    title:'تم بنجاح',
                    text:'تم إدخال التقرير بنجاح'
                }).then(()=> window.location.href = redirectUrl);
            },
            error: function(xhr, status, error){
    msg('error', 'حدث خطأ أثناء الإرسال، الرجاء المحاولة لاحقاً');
    console.error('Status:', status);
    console.error('Error:', error);
    console.error('Response:', xhr.responseText);
}
        });
    });





 $('#unit').change(function() {
    var selectedOption = $(this).val();
   $('#hid_gata').val(selectedOption);
});
 $('#type_block').change(function() {
    var selectedOption = $(this).val();

});
 $('#type_seol').change(function() {
    var selectedOption = $(this).val();
   $('#hid_seol').val(selectedOption);
});
 $('#type_kah').change(function() {
    var selectedOption = $(this).val();
   $('#hid_kah').val(selectedOption);
});
 $('#type_natural').change(function() {
    var selectedOption = $(this).val();
   $('#hid_nat').val(selectedOption);
});




        
});
</script>
