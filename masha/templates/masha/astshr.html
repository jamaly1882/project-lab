            $('#agent_fields').hide();

    function errorAlert(message, selector = null, tabSelector = null) {
        Swal.fire({
            icon: 'error',
            title: 'خطأ',
            text: message,
            confirmButtonText: 'موافق'
        }).then(() => {
            if (selector) {
                $(selector).focus().css('border-color', 'red');
            }
            if (tabSelector) {
                $('.nav-tabs a[href="' + tabSelector + '"]').trigger('click');
            }
