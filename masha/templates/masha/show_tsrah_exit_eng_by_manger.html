{% load static %}

<div class="container">

    <!-- جدول البيانات -->
    <div class="templatemo-content-widget no-padding">
        <div class="panel panel-default table-responsive">
            <table class="table table-striped table-bordered templatemo-user-table">
                <thead>
                <tr align="right">
                    <th>تصريح خروج</th>
                    <th>اسم الحي</th>
                    <th>اسم المالك</th>
                    <th>اسم مقدم الطلب</th>
                    
                    <th>المديرية</th>
                    <th>نوع الطلب</th>
                    <th>تاريخ الطلب</th>
                    <th>رقم الطلب</th>
                </tr>
                </thead>
         
        <tbody id="results_body">
            <!-- تظهر النتائج هنا -->
        </tbody>
    </table>
        </div>
    </div>
</div>
 <script src="{% static 'assets/js/jquery-3.6.0.min.js' %}"> </script>
<!-- جافاسكربت للبحث اللحظي -->
<script>
$(document).ready(function(){
    $('#live_search').on('input', function(){
        let query = $(this).val().trim();
        if(query === ""){
            $('#results_body').html('');
            return;
        }

        $.ajax({
            url: "{% url 'masha:live_search_tsrah_exit' %}",
            data: { q: query },
            success: function(res){
                let tbody = '';
                if(res.results.length > 0){
                    res.results.forEach(function(item){
                        tbody += `<tr>
                           <td><a href="${editUrlBase}${item.id}"  target="_blank">طباعة</a>
</td>
                            <td>${item.streat_name}</td>
                            <td>${item.name}</td>
                            <td>${item.name_wk}</td>
                          
                            <td>${item.mahfth_name}</td>
                            <td>${item.hidden_ansh_hdm}</td>
                            <td>${item.ajaml}</td>
                            <td>${item.id}</td>
                        </tr>`;
                    });
                } else {
                    tbody = "<tr><td colspan='10' style='text-align:center'>لا توجد نتائج</td></tr>";
                }
                $('#results_body').html(tbody);
            },
            error: function(err){ console.log(err); }
        });
    });
});
</script>

<script>
  const editUrlBase = "{% url 'masha:asder_astmart_location_report' 0  %}".slice(0, -2); 
  // slice(-2) لإزالة الرقم 0 و الـ /
</script>
</body>
</html>
