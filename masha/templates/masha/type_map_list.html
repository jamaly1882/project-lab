{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نظام المساحة الإلكتروني</title>

  <!-- CSS -->
  <link href="{% static 'css/font-awesome.min.css' %}" rel="stylesheet">
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'css/templatemo-style.css' %}" rel="stylesheet">
  <link href="{% static 'css/sweetalert2.min.css' %}" rel="stylesheet">

  <!-- jQuery -->
  <script src="{% static 'assets/js/jquery-3.6.0.min.js' %}"></script>
  <script src="{% static 'js/sweetalert2.all.min.js' %}"></script>

<style>
  /* تعريف خط Noto Kufi Arabic */
  @font-face {
    font-family: 'Noto Kufi Arabic';
    src: url("{% static 'fonts/NotoKufiArabic-Regular.ttf' %}") format('truetype');
    font-weight: normal;
    font-style: normal;
  }
  @font-face {
    font-family: 'Noto Kufi Arabic';
    src: url("{% static 'fonts/NotoKufiArabic-Bold.ttf' %}") format('truetype');
    font-weight: bold;
    font-style: normal;
  }

  /* تطبيق الخط على جميع الصفحة */
  body, input, select, textarea, button, table {
    font-family: 'Noto Kufi Arabic', sans-serif;
    font-size: 18px; /* حجم الخط العام */
    direction: rtl;
    text-align: right;
    background: #f5f6fa;
  }

  h1 { font-size: 36px; }
  h2 { font-size: 28px; font-weight: bold; margin-bottom: 30px; text-align: center; }
  h3 { font-size: 24px; }

  /* أزرار */
  .templatemo-blue-button {
    font-size: 16px;
    padding: 12px 25px;
    border-radius: 8px;
    cursor: pointer;
  }
  .templatemo-blue-button:hover {
    background:#2c80c9;
  }

  /* الجداول */
  .table td, .table th {
    font-size: 16px;
    text-align: right;
  }

  /* الفورم */
  .form-control {
    font-size: 16px;
    padding: 10px;
  }

  /* تنظيم الصفحة */
  .templatemo-flex-row {
    display: flex;
    flex-direction: row-reverse;
  }
  .templatemo-sidebar {
    order: 1;
    right: 0;
    left: auto;
  }
  .templatemo-content {
    order: 2;
    width: 100%;
    padding: 40px;
  }
</style>


</head>

<body>
  <div class="templatemo-flex-row">
    <!-- القائمة الجانبية -->
    <div class="templatemo-sidebar">
      <header class="templatemo-site-header">
        <div class="square"></div>
        <h1>مدير النظام</h1>
      </header>

      <div class="profile-photo-container">
        <img src="{% static 'assets/image/bg-head-03.jpg' %}" alt="Profile Photo" class="img-responsive">
        <div class="profile-photo-overlay"></div>
      </div>

      <form class="templatemo-search-form" role="search">
        <div class="input-group">
          <button type="submit" class="fa fa-search"></button>
          <input type="text" class="form-control" placeholder="بحث" name="srch-term" id="srch-term">
        </div>
      </form>

      <div class="mobile-menu-icon"><i class="fa fa-bars"></i></div>

      <nav class="templatemo-left-nav">
        <ul>
          <li><a href="{% url 'masha:index' %}" class="active"><i class="fa fa-home fa-fw"></i>الرئيسية</a></li>
         
          <li><a href="{% url 'accounts:user_logout' %}"><i class="fa fa-eject fa-fw"></i>تسجيل الخروج</a></li>
        </ul>
      </nav>
    </div>

<div class="container">
     <div class="templatemo-content-widget white-bg p-3 mb-4">
       <h2 class="mb-4">انظمة الاسقاط المستخدمة</h2>
    <form id="typeForm" class="mb-4">
        <input type="hidden" id="typeId" name="id">
        <div class="mb-3">
            <input type="text" id="typeName" name="name" class="form-control" placeholder="أدخل الاسم">
        </div>
        <button type="submit" class="btn btn-primary">حفظ</button>
        <button type="button" id="cancelEdit" class="btn btn-secondary d-none">إلغاء</button>
    </form>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>الرقم</th>
                <th>الاسم</th>
                <th>الإجراءات</th>
            </tr>
        </thead>
        <tbody id="typeList">
            <!-- البيانات سيتم تحميلها بواسطة AJAX -->
        </tbody>
    </table>
</div>

<script>
function loadTypes() {
    $.get("{% url 'masha:type_map_ajax' %}", function(data){
        let list = '';
        data.type_maps.forEach((item, index) => {
            list += `<tr>
                <td>${index + 1}</td>
                <td>${item.name}</td>
                <td>
                    <button class="btn btn-sm btn-warning editBtn" data-id="${item.id}" data-name="${item.name}">تعديل</button>
                    <button class="btn btn-sm btn-danger deleteBtn" data-id="${item.id}">حذف</button>
                </td>
            </tr>`;
        });
        $('#typeList').html(list);
    });
}

$(document).ready(function(){
    loadTypes();

    // إضافة أو تعديل
    $('#typeForm').submit(function(e){
        e.preventDefault();
        let id = $('#typeId').val();
        let name = $('#typeName').val();
        $.post("{% url 'masha:type_map_ajax' %}", {id: id, name: name, csrfmiddlewaretoken: '{{ csrf_token }}'}, function(data){
            if(data.status === 'success'){
                $('#typeId').val('');
                $('#typeName').val('');
                $('#cancelEdit').addClass('d-none');
                loadTypes();
            } else {
                alert('خطأ: ' + JSON.stringify(data.errors));
            }
        });
    });

    // تعديل
    $(document).on('click', '.editBtn', function(){
        $('#typeId').val($(this).data('id'));
        $('#typeName').val($(this).data('name'));
        $('#cancelEdit').removeClass('d-none');
    });

    // إلغاء التعديل
    $('#cancelEdit').click(function(){
        $('#typeId').val('');
        $('#typeName').val('');
        $(this).addClass('d-none');
    });

    // حذف
    $(document).on('click', '.deleteBtn', function(){
        if(confirm('هل أنت متأكد من الحذف؟')){
            let id = $(this).data('id');
            $.post("{% url 'masha:type_map_ajax' %}", {
                id: id,
                action: 'delete',
                csrfmiddlewaretoken: '{{ csrf_token }}'
            }, function(data){
                if(data.status === 'deleted'){
                    loadTypes();
                } else {
                    alert('حدث خطأ أثناء الحذف');
                }
            });
        }
    });
});
</script>
</body>
</html>
